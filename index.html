<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chasse au Trésor — Historique</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>
      <img class="logo" src="logo.png" alt="" />
      <span class="title-text">Chasse au Trésor</span>
    </h1>
    <p class="tagline">Historique des parties</p>
  </header>

  <main id="app">
    <section id="list-view">
      <div id="stats-bar" class="stats-bar" hidden></div>
      <h2>Parties <span id="games-count" class="count-badge"></span></h2>
      <div id="games-list" class="games-list">Chargement…</div>
    </section>

    <section id="detail-view" hidden>
      <button id="back-btn" class="back-btn">Retour</button>
      <div id="game-detail"></div>
    </section>


  </main>

  <section class="server-card-wrap">
    <div class="server-card">
      <div class="server-card-head">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="server-name">Zinzinland</span>
        <span class="version-chip">Minecraft 1.21.11</span>
      </div>

      <div class="server-card-body">
        <div class="ip-block">
          <span class="ip-label">Adresse du serveur</span>
          <div class="ip-row">
            <code class="ip-value">zinzinland.mine.fun</code>
            <button class="copy-btn" type="button" data-copy="zinzinland.mine.fun" title="Copier l'IP" aria-label="Copier l'IP">
              <svg class="ico-copy" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <svg class="ico-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <span class="copy-text">Copier</span>
            </button>
          </div>
        </div>

        <a class="discord-btn" href="https://discord.gg/ninjaxx" target="_blank" rel="noopener noreferrer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3.2a.075.075 0 0 0-.079.037c-.21.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.249.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 5.683 4.369a.07.07 0 0 0-.032.027C2.533 9.046 1.667 13.58 2.092 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.105 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.106c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.661a.061.061 0 0 0-.031-.028zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.974 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          <span>Rejoindre le Discord</span>
        </a>
      </div>
    </div>
  </section>

  <footer>
    <p>Données mises à jour automatiquement depuis le serveur Minecraft.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
