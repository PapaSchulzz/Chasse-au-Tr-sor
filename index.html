<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chasse au Trésor — Historique</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>
      <img class="logo" src="logo.png" alt="" />
      <span class="title-text">Chasse au Trésor</span>
    </h1>
    <p class="tagline">Historique des parties</p>
  </header>

  <main id="app">
    <section id="list-view">
      <div id="stats-bar" class="stats-bar" hidden></div>
      <h2>Parties <span id="games-count" class="count-badge"></span></h2>
      <div id="games-list" class="games-list">Chargement…</div>
    </section>

    <section id="detail-view" hidden>
      <button id="back-btn" class="back-btn">Retour</button>
      <div id="game-detail"></div>
    </section>


  </main>

  <section class="server-card-wrap">
    <div class="server-card">
      <div class="server-card-head">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="server-name">Zinzinland</span>
        <span class="version-chip">Minecraft 1.21.11</span>
      </div>

      <div class="server-card-body">
        <div class="ip-block">
          <span class="ip-label">Adresse du serveur</span>
          <div class="ip-row">
            <code class="ip-value">zinzinland.mine.fun</code>
            <button class="copy-btn" type="button" data-copy="zinzinland.mine.fun" title="Copier l'IP" aria-label="Copier l'IP">
              <svg class="ico-copy" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <svg class="ico-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <span class="copy-text">Copier</span>
            </button>
          </div>
        </div>

        <a class="discord-btn" href="https://discord.gg/ninjaxx" target="_blank" rel="noopener noreferrer">
          <svg width="24" height="18" viewBox="0 0 127.14 96.36" fill="currentColor" aria-hidden="true"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg>
          <span>Rejoindre le Discord</span>
        </a>
      </div>
    </div>
  </section>

  <footer>
    <p>Données mises à jour automatiquement depuis le serveur Minecraft.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
