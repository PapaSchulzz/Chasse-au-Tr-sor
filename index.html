<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chasse au Trésor — Historique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jersey+10&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="title-plaque">
      <h1>
        <img class="logo" src="logo.png" alt="" />
        Chasse au Trésor
      </h1>
    </div>
    <p class="tagline">Historique des parties</p>
  </header>

  <main id="app">
    <section id="list-view">
      <div id="stats-bar" class="stats-bar" hidden></div>
      <h2>Parties <span id="games-count" class="count-badge"></span></h2>
      <div id="games-list" class="games-list">Chargement…</div>
    </section>

    <section id="detail-view" hidden>
      <button id="back-btn" class="back-btn">Retour</button>
      <div id="game-detail"></div>
    </section>
  </main>

  <footer>
    <p>Données mises à jour automatiquement depuis le serveur Minecraft.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
